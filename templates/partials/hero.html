<section class="hero-page hero-page-services generated-hero">
  <picture class="hero-media hero-media-services" aria-hidden="true">
    <source type="image/avif" srcset="assets/hero/{{heroAsset}}-400.avif 400w, assets/hero/{{heroAsset}}-800.avif 800w, assets/hero/{{heroAsset}}-1200.avif 1200w, assets/hero/{{heroAsset}}-1600.avif 1600w" sizes="100vw">
    <source type="image/webp" srcset="assets/hero/{{heroAsset}}-400.webp 400w, assets/hero/{{heroAsset}}-800.webp 800w, assets/hero/{{heroAsset}}-1200.webp 1200w, assets/hero/{{heroAsset}}-1600.webp 1600w" sizes="100vw">
    <img src="assets/hero/{{heroAsset}}-1200.webp" alt="" fetchpriority="high" decoding="async">
  </picture>
  <div class="container"><p class="eyebrow">{{heroLabel}}</p><h1>{{heroTitle}}</h1><p class="lede">{{heroLead}}</p><div class="hero-actions"><a class="button primary" href="on-gorusme.html">Ücretsiz ön görüşme</a><a class="button secondary" href="hizmetler.html">Tüm hizmetler</a></div></div>
</section>
